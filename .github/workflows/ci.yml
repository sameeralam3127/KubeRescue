name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race detector + coverage)
        run: go test -race -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Shellcheck the vulncheck scripts
        run: shellcheck scripts/*.sh

      - name: Self-test the vulncheck classifier
        run: ./scripts/vulncheck_test.sh

      # Pull requests fail on dependency vulnerabilities only. A stdlib CVE can
      # be disclosed against the pinned toolchain at any time and has nothing to
      # do with the pull request that happens to run next, so it is reported in
      # the job summary here and chased by .github/workflows/vulncheck.yml.
      - name: govulncheck
        run: ./scripts/vulncheck.sh --mode pr
