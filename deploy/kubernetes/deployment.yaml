apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberescue
  namespace: kuberescue-system
  labels:
    app.kubernetes.io/name: kuberescue
    app.kubernetes.io/part-of: kuberescue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberescue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberescue
        app.kubernetes.io/part-of: kuberescue
    spec:
      serviceAccountName: kuberescue
      containers:
        - name: kuberescue
          image: kuberescue:local
          imagePullPolicy: IfNotPresent
          args:
            - --namespace
            - default
            - --interval
            - "10"
            - --max-restarts
            - "3"
