apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberescue
  namespace: kuberescue-system
  labels:
    app.kubernetes.io/name: kuberescue
    app.kubernetes.io/part-of: kuberescue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberescue
  labels:
    app.kubernetes.io/name: kuberescue
    app.kubernetes.io/part-of: kuberescue
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuberescue
  labels:
    app.kubernetes.io/name: kuberescue
    app.kubernetes.io/part-of: kuberescue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuberescue
subjects:
  - kind: ServiceAccount
    name: kuberescue
    namespace: kuberescue-system
