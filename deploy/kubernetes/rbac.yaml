apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberescue
  namespace: kuberescue-system
  labels:
    app.kubernetes.io/name: kuberescue
    app.kubernetes.io/part-of: kuberescue
---
# KubeRescue is granted access only in the namespace it monitors.
# Create one Role + RoleBinding per monitored namespace; do NOT use a
# ClusterRole unless you genuinely intend cluster-wide remediation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberescue
  namespace: default # the namespace KubeRescue monitors
  labels:
    app.kubernetes.io/name: kuberescue
    app.kubernetes.io/part-of: kuberescue
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberescue
  namespace: default # must match the Role's namespace
  labels:
    app.kubernetes.io/name: kuberescue
    app.kubernetes.io/part-of: kuberescue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberescue
subjects:
  - kind: ServiceAccount
    name: kuberescue
    namespace: kuberescue-system
