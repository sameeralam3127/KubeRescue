apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  labels:
    app.kubernetes.io/name: crashloop-demo
    app.kubernetes.io/part-of: kuberescue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crashloop-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashloop-demo
        app.kubernetes.io/part-of: kuberescue
    spec:
      containers:
        - name: crashloop-demo
          image: kuberescue:local
          imagePullPolicy: Never
          command:
            - python
            - -c
            - "import sys; sys.exit(1)"
